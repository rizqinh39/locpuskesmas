name: Android CI/CD - Auto Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Memungkinkan Anda menekan tombol "Run workflow" secara manual dari GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create Secrets & Properties Files
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > secrets.properties
          touch local.defaults.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocPuskesmas-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
